# Production stack. For development, add compose.dev.yaml (see README).
services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    # Health check is defined in the Dockerfile

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - api
