# Production stack. For development, add compose.dev.yaml (see README).
services:
  api:
    build:
      context: .
      target: runtime
    # No published port: only nginx reaches the API, over the compose network
    # Health check is defined in the Dockerfile

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - api
