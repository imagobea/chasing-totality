# Production stack. For development, add compose.dev.yaml (see README).
services:
  api:
    build:
      context: .
      target: runtime
    # No published port: only nginx reaches the API, over the compose network
    # Healthy only once the data has loaded, since the API listens after loading
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT ?? 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      # Check every second during start-up, so web doesn't wait a full interval
      start_interval: 1s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    ports:
      - "8080:80"
    # Starts only once the API is healthy, so a broken boot fails here instead of nginx answering 502s
    depends_on:
      api:
        condition: service_healthy
