server {
    listen 80;
    root /usr/share/nginx/html;

    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/geo+json application/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;

    # The browser calls /api/health, the API serves /health (same rule as vite.config.ts)
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # The app is a single page with no routes, so anything that isn't a real file is a 404
    location / {
        try_files $uri $uri/ =404;
    }
}
