server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser calls /api/health, the API serves /health (same rule as vite.config.ts)
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Any other path gets the app, which is a single page
    location / {
        try_files $uri /index.html;
    }
}
