server {
    listen 80;
    root /usr/share/nginx/html;

    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/geo+json application/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;

    # The browser calls /api/health, the API serves /health (same rule as vite.config.ts)
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Only / serves the app, which is a single page with no routes
    location = / {
        try_files /index.html =404;
    }

    # Any other path is a real file or a 404, directories included
    location / {
        try_files $uri =404;
    }
}
