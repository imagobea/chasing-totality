# Development overrides, used on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    # Own image name, so dev and prod builds don't overwrite each other
    image: chasing-totality-api-dev
    build:
      target: dev
    command: ["pnpm", "dev"]
    # Pinned, so a host .env meant for pnpm dev can't move the API off the mapped port
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      # Live repo, so edits and outputs (e.g. out/) are shared with the host
      - .:/app
      # Keep the image's node_modules rather than the host's
      - /app/node_modules

  web:
    image: chasing-totality-web-dev
    build:
      target: dev
    # Replaces the nginx port from compose.yaml instead of adding to it
    ports: !override
      - "5173:5173"
    environment:
      # The dev server forwards /api here
      API_PROXY_TARGET: http://api:3000
    volumes:
      # Live source, so edits show up without rebuilding
      - ./web:/app/web
      # Keep the image's node_modules rather than the host's
      - /app/web/node_modules
